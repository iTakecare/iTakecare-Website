# Ne reçoit que /lp/* et /lp-assets/* : Traefik envoie tout le reste au site existant.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/html application/javascript text/css application/json image/svg+xml;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Les LP vivent du trafic payant : on ne les indexe pas.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location /lp-assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  # Routing SPA : /lp/sante, /lp/sante/merci… rendent index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }
}
