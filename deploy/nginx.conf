# Ne reçoit que /lp/* et /lp-assets/* : Traefik envoie tout le reste au site existant.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/html application/javascript text/css application/json image/svg+xml;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Les LP vivent du trafic payant : on ne les indexe pas.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location /lp-assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }

  # /lp/sante… ont leur propre index.html (aperçu Facebook), /lp/og/* les images d'aperçu ;
  # le reste (/lp/sante/merci…) rend index.html (routing SPA).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/index.html /index.html;
  }
}
